site_name: Physics 281 —  Quality of Life Improvements in VSCode
theme:
  name: zensical
  font: false                # system fonts; no Google Fonts request
  features:
    - content.tabs.link      # selecting a platform switches every tab on the site
    - content.code.copy      # copy button on code blocks
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      accent: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      accent: teal
      toggle: {icon: material/brightness-4, name: Switch to light mode}

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/sections.js
  - javascripts/zoom.js         # ?zoom=1.25 in the URL scales the page

plugins:
  - search
  - offline                  # search from file://; sets use_directory_urls: false

extra:
  generator: false           # drop the external "Made with Zensical" link
  polyfills:
    # Local shim; the file name must contain "iframe-worker",
    # otherwise Zensical loads it from unpkg.com
    - path: javascripts/iframe-worker-shim.js
      type: text/javascript

markdown_extensions:
  - admonition
  - attr_list              # required for {.side-rule} and {.collapsed}
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - index.md
